<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Richter Architects</title>
<meta name="description" content="Richter Architects, Corpus Christi, Texas. Architecture, master planning, programming and interior design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#ffffff;
  --ink:#141313;
  --stone:#6f6a69;
  --mist:#a39d9c;
  --rule:#e7e3e2;
  --tint:#f4f2f1;
  --red:#fe0000;
  --night:#0f0e0e;
  --night-2:#1a1818;
  --night-ink:#f2efee;
  --night-dim:#8f8988;
  --night-rule:#2c2928;
  --gutter:clamp(18px,3.4vw,56px);
  --wide:1560px;
  --text:660px;
  --ease:cubic-bezier(.19,1,.22,1);
  --ease2:cubic-bezier(.65,0,.35,1);
  --sans:"Jost","Futura","Century Gothic","Avenir Next","Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{max-width:100%;height:auto;display:block}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--red);outline-offset:4px}
h1,h2,h3{font-weight:300;margin:0;text-wrap:balance}
p{margin:0}
.label{font-size:12px;font-weight:500;letter-spacing:.26em;text-transform:uppercase}
.dim{color:var(--stone)}
.link{display:inline-flex;align-items:center;gap:14px;font-size:12px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;padding-bottom:7px;background:linear-gradient(currentColor,currentColor) left bottom/100% 1px no-repeat;transition:background-size .7s var(--ease)}
.link:hover{background-size:0 1px;background-position:right bottom}
.link i{display:inline-block;width:28px;height:1px;background:currentColor;position:relative;transition:width .6s var(--ease)}
.link i::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.link:hover i{width:44px}

/* ---------- header ---------- */
.hd{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);color:var(--ink);transition:transform .7s var(--ease),background-color .5s,color .5s,box-shadow .5s}
.hd-in{max-width:var(--wide);margin:0 auto;padding-inline:var(--gutter);height:96px;display:flex;align-items:center;justify-content:space-between;transition:height .6s var(--ease)}
.hd.solid{background:var(--paper);box-shadow:0 1px 0 var(--rule)}
.hd.solid .hd-in{height:74px}
.hd.over{color:#fff}
.hd.hide{transform:translateY(-110%)}
.logo{display:block;width:168px;transition:width .6s var(--ease)}
.hd.solid .logo{width:136px}
.nav{display:flex;gap:clamp(28px,3.4vw,56px)}
.nav a{font-size:12px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;padding-block:10px;position:relative}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:currentColor;transition:right .6s var(--ease)}
.nav a:hover::after{right:0}
.nav a[aria-current="page"]::after{right:0;background:var(--red)}
.burger{display:none;font-size:12px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;align-items:center;gap:12px;padding-block:10px}
.burger b{display:grid;gap:6px;width:26px}
.burger b i{display:block;height:1px;background:currentColor}
.menu{position:fixed;inset:0;z-index:70;background:var(--night);color:var(--night-ink);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) var(--gutter) calc(28px + env(safe-area-inset-bottom,0px))}
.menu-top{height:84px;display:flex;align-items:center;justify-content:space-between}
.menu-top img{width:132px}
.menu nav{display:grid;align-content:center;gap:6px}
.menu nav a{font-size:clamp(40px,11vw,64px);font-weight:300;line-height:1.15;overflow:hidden;display:block}
.menu nav a span{display:inline-block;transform:translateY(105%);transition:transform .9s var(--ease)}
.menu.open nav a span{transform:none}
.menu nav a:nth-child(2) span{transition-delay:.06s}.menu nav a:nth-child(3) span{transition-delay:.12s}.menu nav a:nth-child(4) span{transition-delay:.18s}
.menu address{font-style:normal;font-size:14px;color:var(--night-dim);line-height:1.8}

/* ---------- curtain + cursor ---------- */
.curtain{position:fixed;inset:0;z-index:90;background:var(--night);display:grid;place-items:center;transform:translateY(100%);pointer-events:none}
.curtain img{width:0;max-width:none;opacity:0}
.curtain.intro{transform:none}
.curtain.intro img{animation:logoIn 1.1s var(--ease) .15s forwards}
@keyframes logoIn{from{width:120px;opacity:0;clip-path:inset(0 100% 0 0)}to{width:220px;opacity:1;clip-path:inset(0 0 0 0)}}
.curtain.cover{transform:none;transition:transform .55s var(--ease2)}
.curtain.leave{transform:translateY(-100%);transition:transform .9s var(--ease2)}
.cur{position:fixed;left:0;top:0;z-index:80;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(20,19,19,.92);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;pointer-events:none;transform:scale(0);transition:transform .45s var(--ease)}
.cur.on{transform:scale(1)}
@media (pointer:coarse){.cur{display:none}}

/* ---------- shared motion ---------- */
.rv{clip-path:inset(100% 0 0 0);transition:clip-path 1.5s var(--ease)}
.rv .zo{transform:scale(1.28);transition:transform 2.2s var(--ease)}
.rv.in{clip-path:inset(0 0 0 0)}
.rv.in .zo{transform:scale(1)}
.up{opacity:0;transform:translateY(46px);transition:opacity 1.2s var(--ease),transform 1.4s var(--ease)}
.up.in{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.mask>span{display:inline-block;transform:translateY(110%);transition:transform 1.3s var(--ease)}
.in .mask>span,.mask.in>span{transform:none}
.pi{width:100%;height:100%;overflow:hidden}
.pi img{width:100%;height:100%;object-fit:cover;will-change:transform}
.pi.par img{height:118%;margin-top:-9%}
.words .w{opacity:.12;transition:opacity .25s linear}

/* ---------- home hero ---------- */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:var(--night);color:#fff}
.hero .slides{position:absolute;inset:0;will-change:transform}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s var(--ease2)}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 8s linear}
.slide.on img{transform:scale(1)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.42),rgba(0,0,0,0) 26%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6));pointer-events:none}
.hero .veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.hero-foot{position:absolute;left:0;right:0;bottom:0;max-width:var(--wide);margin:0 auto;padding:0 var(--gutter) clamp(28px,5vh,56px);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:20px}
.hero-cap{grid-column:2;text-align:center;display:grid;gap:10px;justify-items:center}
.hero-cap .nm{font-size:clamp(26px,3.6vw,54px);font-weight:300;line-height:1.1;letter-spacing:.01em}
.hero-cap .nm a{display:block}
.hero-cap .pl{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
.hero-nav{display:flex;align-items:center;gap:18px;font-size:12px;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.hero-nav.l{justify-self:start}.hero-nav.r{justify-self:end}
.circ{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;transition:background .4s,border-color .4s,color .4s}
.circ:hover{background:#fff;color:var(--ink);border-color:#fff}
.circ svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.2}
.prog{position:absolute;left:0;bottom:0;height:2px;background:var(--red);width:0}
.prog.run{animation:grow 7s linear forwards}
@keyframes grow{to{width:100%}}
.cue{position:absolute;left:50%;top:calc(100svh - 0px);transform:translate(-50%,-100%)}
.hero-cap .nm .mask>span{transition-duration:1.1s}

/* ---------- statement ---------- */
.statement{max-width:1180px;margin:0 auto;padding:clamp(120px,18vh,220px) var(--gutter);text-align:center;display:grid;gap:44px;justify-items:center}
.statement p.big{font-size:clamp(28px,3.9vw,58px);font-weight:300;line-height:1.24;letter-spacing:.005em;text-wrap:balance}
.statement .label{color:var(--stone)}

/* ---------- expand ---------- */
.xp{position:relative;height:280vh;background:var(--paper)}
.xp-stick{position:sticky;top:0;height:100vh;overflow:hidden}
.xp-img{position:absolute;inset:0;clip-path:inset(var(--it,24vh) var(--is,30vw));will-change:clip-path}
.xp-img img{width:100%;height:100%;object-fit:cover;transform:scale(var(--sc,1.3))}
.xp-shade{position:absolute;inset:0;background:rgba(0,0,0,.34);opacity:var(--op,0)}
.xp-txt{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:22px;text-align:center;color:#fff;padding-inline:var(--gutter);opacity:var(--op,0);transform:translateY(calc((1 - var(--op,0)) * 40px))}
.xp-txt h2{font-size:clamp(34px,5.4vw,84px);line-height:1.05;max-width:16ch}
.xp-txt p{font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.xp-side{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--stone);opacity:calc(1 - var(--op,0) * 1.6)}
.xp-side.l{left:var(--gutter)}.xp-side.r{right:var(--gutter)}

/* ---------- horizontal reel ---------- */
.hs{position:relative;background:var(--paper)}
.hs-stick{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;grid-template-columns:100%;grid-template-rows:auto 1fr auto;padding-block:clamp(96px,13vh,130px) clamp(28px,5vh,52px)}
.hs-head{max-width:var(--wide);width:100%;margin:0 auto;padding-inline:var(--gutter);display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:clamp(20px,3.4vh,40px)}
.hs-head h2{font-size:clamp(30px,3.6vw,54px);line-height:1}
.hs-count{font-size:13px;letter-spacing:.2em;font-variant-numeric:tabular-nums;color:var(--stone)}
.hs-count b{color:var(--ink);font-weight:500}
.hs-track{display:flex;gap:clamp(20px,2.6vw,44px);padding-inline:max(var(--gutter),calc((100vw - var(--wide)) / 2 + var(--gutter)));will-change:transform;min-height:0}
.panel{flex:0 0 auto;width:min(64vw,1000px);display:grid;grid-template-rows:1fr auto;gap:18px;min-height:0}
.panel .frame{overflow:hidden;background:var(--tint);min-height:0}
.panel .frame img{width:124%;max-width:none;height:100%;object-fit:cover;margin-left:-12%;will-change:transform;transition:scale 1.4s var(--ease)}
.panel:hover .frame img{scale:1.04}
.panel .meta{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.panel h3{font-size:clamp(18px,1.6vw,24px);font-weight:400}
.panel .meta span{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--stone);white-space:nowrap}
.panel.end{width:min(40vw,560px);display:grid;place-content:center;justify-items:center;gap:26px;text-align:center;background:var(--tint)}
.panel.end h3{font-size:clamp(28px,3vw,44px);font-weight:300}
.hs-bar{max-width:var(--wide);width:100%;margin:clamp(20px,3vh,36px) auto 0;padding-inline:var(--gutter)}
.hs-bar div{height:1px;background:var(--rule);position:relative}
.hs-bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);width:0}

/* ---------- sectors (dark) ---------- */
.dark{background:var(--night);color:var(--night-ink)}
.sectors{max-width:var(--wide);margin:0 auto;padding:clamp(110px,15vh,180px) var(--gutter);position:relative}
.sec-head{display:grid;justify-items:center;gap:16px;text-align:center;margin-bottom:clamp(48px,7vh,80px)}
.sec-head h2{font-size:clamp(30px,3.6vw,54px);line-height:1.08}
.dark .label{color:var(--night-dim)}
.slist{border-top:1px solid var(--night-rule)}
.srow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:clamp(18px,2.6vh,30px);border-bottom:1px solid var(--night-rule);position:relative;z-index:2}
.srow .t{grid-column:2;grid-row:1;font-size:clamp(28px,4.6vw,72px);font-weight:300;line-height:1.1;text-align:center;transition:color .5s,letter-spacing .8s var(--ease)}
.srow .n{grid-column:1;grid-row:1;justify-self:start;font-size:13px;letter-spacing:.2em;color:var(--night-dim);font-variant-numeric:tabular-nums}
.srow .a{grid-column:3;grid-row:1;justify-self:end;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--night-dim);opacity:0;transform:translateX(-12px);transition:opacity .5s,transform .7s var(--ease)}
.slist:hover .srow .t{color:#5b5655}
.slist .srow:hover .t{color:var(--night-ink);letter-spacing:.02em}
.srow:hover .a{opacity:1;transform:none}
.float{position:fixed;left:0;top:0;width:340px;aspect-ratio:4/3;z-index:1;pointer-events:none;overflow:hidden;opacity:0;transform:scale(.8);transition:opacity .45s,transform .7s var(--ease)}
.float.on{opacity:1;transform:scale(1)}
.float img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.float img.on{opacity:1}

/* ---------- numbers ---------- */
.nums{max-width:var(--wide);margin:0 auto;padding:clamp(100px,14vh,160px) var(--gutter);display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.num{display:grid;gap:14px;padding-inline:20px;justify-items:center}
.num+.num{border-left:1px solid var(--rule)}
.num b{font-size:clamp(56px,7.4vw,120px);font-weight:300;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num p{font-size:15px;color:var(--stone);max-width:26ch}
.num .label{color:var(--ink)}

/* ---------- cta footer ---------- */
.cta{position:relative;height:88vh;min-height:520px;overflow:hidden;color:#fff;display:grid;place-items:center;text-align:center}
.cta .pi{position:absolute;inset:0}
.cta::after{content:"";position:absolute;inset:0;background:rgba(10,9,9,.55)}
.cta-in{position:relative;z-index:2;display:grid;gap:30px;justify-items:center;padding-inline:var(--gutter)}
.cta-in h2{font-size:clamp(38px,6vw,96px);line-height:1.02}
.cta-in address{font-style:normal;font-size:13px;letter-spacing:.24em;text-transform:uppercase;line-height:2.1;opacity:.9}
.foot{background:var(--night);color:var(--night-dim)}
.foot-in{max-width:var(--wide);margin:0 auto;padding:36px var(--gutter) calc(36px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;font-size:12px;letter-spacing:.14em}
.foot-in img{width:112px}
.foot-in nav{display:flex;gap:30px}
.foot-in nav a{text-transform:uppercase;letter-spacing:.24em}
.foot-in nav a:hover{color:var(--night-ink)}

/* ---------- page heads (no hero) ---------- */
.phead{max-width:var(--wide);margin:0 auto;padding:calc(170px + env(safe-area-inset-top,0px)) var(--gutter) clamp(56px,7vh,88px);display:grid;justify-items:center;gap:22px;text-align:center}
.phead h1{font-size:clamp(52px,10vw,160px);line-height:.92;letter-spacing:-.01em}
.phead p{max-width:var(--text);color:var(--stone);font-size:18px}

/* ---------- work ---------- */
.tools{max-width:var(--wide);margin:0 auto;padding-inline:var(--gutter);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-bottom:clamp(44px,6vh,72px)}
.filters{grid-column:2;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px}
.filters button,.views button{font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--mist);padding-block:6px;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.filters button:hover,.views button:hover{color:var(--ink)}
.filters button[aria-pressed="true"],.views button[aria-pressed="true"]{color:var(--ink);border-color:var(--red)}
.views{justify-self:end;display:flex;gap:22px}
.wgrid{max-width:var(--wide);margin:0 auto;padding-inline:var(--gutter);display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(48px,6vh,80px) clamp(18px,2.2vw,36px)}
.wcard{display:grid;gap:18px}
.wcard .frame{aspect-ratio:4/5;overflow:hidden;background:var(--tint)}
.wcard:nth-child(3n+2) .frame{aspect-ratio:4/5}
.wcard .frame img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease),filter .8s}
.wcard:hover .frame img{transform:scale(1.05)}
.wgrid:hover .wcard:not(:hover) .frame img{filter:grayscale(.85) brightness(1.05)}
.wcard .meta{display:grid;gap:6px;text-align:center}
.wcard h3{font-size:clamp(17px,1.4vw,21px);font-weight:400;line-height:1.3}
.wcard .meta span{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--stone)}
.wcard.hide,.wrow.hide{display:none}
.wlist{max-width:var(--wide);margin:0 auto;padding-inline:var(--gutter);border-top:1px solid var(--rule)}
.wrow{display:grid;grid-template-columns:1.2fr 1fr .9fr;gap:20px;align-items:baseline;padding-block:26px;border-bottom:1px solid var(--rule);transition:padding .6s var(--ease)}
.wrow h3{font-size:clamp(20px,2vw,30px);font-weight:300}
.wrow span{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--stone)}
.wrow span:last-child{text-align:right}
.wrow:hover{padding-inline:18px}
.boards{background:var(--tint);margin-top:clamp(110px,14vh,170px)}
.boards .sectors{padding-block:clamp(100px,13vh,150px)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2.2vw,36px)}
.bgrid .frame{aspect-ratio:16/10;overflow:hidden}
.bgrid .frame img{width:100%;height:100%;object-fit:cover}
.bgrid h3{font-size:18px;font-weight:400;text-align:center;margin-top:18px}

/* ---------- project ---------- */
.ph{position:relative;height:100svh;min-height:560px;overflow:hidden;background:var(--night);color:#fff}
.ph .pi{position:absolute;inset:0}
.ph .pi img{transform-origin:center}
.ph .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4),rgba(0,0,0,0) 30%,rgba(0,0,0,.05) 50%,rgba(0,0,0,.66))}
.ph-txt{position:absolute;left:0;right:0;bottom:0;padding:0 var(--gutter) clamp(44px,8vh,90px);display:grid;justify-items:center;gap:20px;text-align:center}
.ph-txt h1{font-size:clamp(38px,6.6vw,108px);line-height:1;max-width:16ch}
.ph-txt .label{opacity:.9}
.facts{max-width:1180px;margin:0 auto;padding-inline:var(--gutter);padding-top:clamp(80px,11vh,130px)}
.facts-in{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.facts-in>div{padding:32px 24px;text-align:center;display:grid;gap:10px;align-content:start}
.facts-in>div+div{border-left:1px solid var(--rule)}
.facts-in .label{color:var(--stone)}
.facts-in p,.facts-in li{font-size:16px;line-height:1.5}
.facts-in ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.syn{max-width:1180px;margin:0 auto;padding:clamp(80px,11vh,130px) var(--gutter)}
.syn .lead{font-size:clamp(24px,2.7vw,40px);font-weight:300;line-height:1.3;text-align:center;max-width:26ch;margin:0 auto;text-wrap:balance}
.syn .body{max-width:var(--text);margin:clamp(44px,6vh,64px) auto 0;display:grid;gap:1.1em;font-size:18px;line-height:1.78}
.syn .credit{font-size:13px;color:var(--stone);text-align:center;letter-spacing:.04em;margin-top:.8em}
.gallery{max-width:var(--wide);margin:0 auto;padding-inline:var(--gutter);display:grid;gap:clamp(14px,1.8vw,28px)}
.g-row{display:flex;gap:clamp(14px,1.8vw,28px);justify-content:center}
.g-row button{display:block;overflow:hidden;background:var(--tint);cursor:zoom-in;padding:0}
.g-row .pi img{transition:scale 1.4s var(--ease)}
.g-row button:hover .pi img{scale:1.03}
.np{display:block;position:relative;height:100svh;min-height:520px;overflow:hidden;color:#fff;margin-top:clamp(110px,14vh,180px);background:var(--night)}
.np .pi{position:absolute;inset:0;clip-path:inset(var(--ni,12%) var(--ns,18%));will-change:clip-path}

    i=(n+slides.length)%slides.length;

    const p=BY[IMG.slides[i][0]];
    cap.innerHTML=`<div class="nm"><a href="#${p.slug}">${masked(p.name)}</a></div><span class="pl up">${esc(p.place)}</span>`;

    prog.classList.remove('run'); void prog.offsetWidth; prog.classList.add('run');
    clearTimeout(slideTimer); slideTimer=setTimeout(()=>show(i+1),7000);
  };
  document.getElementById('sp').onclick=()=>show(i-1);

}

function rows(g){
  const out=[]; let q=g.map((x,i)=>({src:x[0],r:x[1]/x[2],i})); let full=true;
  while(q.length){
    const a=q.shift();
    if(a.r<1){ out.push(q.length?[a,q.shift()]:[a]); continue; }
    if(full||!q.length){ out.push([a]); full=false; } else { out.push([a,q.shift()]); full=true; }
  }
  return out;
}

/* ---------------- scroll engine ---------------- */
const FX = (() => {
  let items=[], vh=innerHeight, vw=innerWidth;
  const setup = () => {
    items = [...main.querySelectorAll('[data-fx]')].map(el => {
      const t = el.dataset.fx, o = {el,t,cur:0};
      if (t==='words' && !el.dataset.split){ el.innerHTML = el.textContent.trim().split(/\s+/).map(w=>`<span class="w">${esc(w)}</span>`).join(' '); el.dataset.split=1; }
      if (t==='words') o.ws=[...el.querySelectorAll('.w')];
      if (t==='hs') { o.track=el.querySelector('.hs-track'); o.bar=el.querySelector('#hsb'); o.cnt=el.querySelector('#hsc'); o.panels=[...el.querySelectorAll('.panel .frame img')]; }
      if (t==='hero') { o.slides=el.querySelector('.slides'); o.veil=el.querySelector('.veil'); o.foot=el.querySelector('.hero-foot'); }
      if (t==='phero') { o.img=el.querySelector('.pi img'); o.txt=el.querySelector('.ph-txt'); }
      if (t==='par') { o.img=el.querySelector('img'); o.amt=+(el.dataset.amt||10); }
      return o;
    });
    main.querySelectorAll('[data-count]').forEach(b=>{b.dataset.done='';});
    size();
  };
  const size = () => {
    vh=innerHeight; vw=innerWidth;
    items.forEach(o=>{ if(o.t==='hs'){ const mobile=vw<=760; o.dist = mobile?0:Math.max(0,o.track.scrollWidth - vw); o.el.style.height = mobile?'':(o.dist + vh)+'px'; } });
  };
  const count = b => {
    if (b.dataset.done) return; b.dataset.done=1;
    const end=+b.dataset.count, start= end>1900 ? end-40 : 0, t0=performance.now(), dur=1800;
    const step=now=>{const k=clamp((now-t0)/dur), e=1-Math.pow(1-k,4); b.textContent=Math.round(start+(end-start)*e); if(k<1)requestAnimationFrame(step);};
    if(RM){b.textContent=end;return;} requestAnimationFrame(step);
  };
  const tick = () => {
    for (const o of items){
      const r=o.el.getBoundingClientRect();
      if (r.bottom < -vh*0.5 || r.top > vh*1.5) { if(o.t!=='hero'&&o.t!=='phero') continue; }
      switch(o.t){
        case 'rv': case 'up':
          if (r.top < vh*0.9 && r.bottom > 0) { o.el.classList.add('in'); o.el.querySelectorAll('.mask').forEach(m=>m.classList.add('in')); o.el.querySelectorAll('[data-count]').forEach(count); }
          break;
        case 'words': {
          const p = clamp((vh*0.86 - r.top)/(r.height + vh*0.36));
          const n=o.ws.length; o.ws.forEach((w,i)=>{ const v=clamp(p*n*1.25 - i*1.0,0,1); w.style.opacity = RM?1:(0.12+0.88*v).toFixed(3); });
          break; }
        case 'par': {
          const p = clamp((vh - r.top)/(vh + r.height)); const target=(p-.5)*o.amt*2;
          o.cur += (target-o.cur)*.12; if(!RM) o.img.style.transform=`translate3d(0,${o.cur.toFixed(2)}%,0)`;
          break; }
        case 'hero': {
          const p = clamp(-r.top / r.height);
          if(!RM){ o.slides.style.transform=`translate3d(0,${(p*28).toFixed(2)}%,0)`; }
          o.veil.style.opacity=(p*0.7).toFixed(3); o.foot.style.opacity=(1-p*2.2).toFixed(3);
          break; }
        case 'phero': {
          const p = clamp(-r.top / r.height);
          if(!RM){ o.img.style.transform=`translate3d(0,${(p*26).toFixed(2)}%,0) scale(${(1.08-p*0.08+ (o.load?0:0)).toFixed(4)})`; }
          o.txt.style.opacity=(1-p*1.8).toFixed(3); o.txt.style.transform=`translate3d(0,${(-p*60).toFixed(1)}px,0)`;
          break; }
        case 'expand': {
          const span=r.height - vh; const p = clamp(-r.top / span); const e = RM?1:clamp(p/0.72);
          const ease = 1-Math.pow(1-e,3);
          const s=o.el.style; const mob=vw<=760;
          s.setProperty('--it', ((1-ease)*(mob?20:22)).toFixed(3)+'vh');
          s.setProperty('--is', ((1-ease)*(mob?12:31)).toFixed(3)+'vw');
          s.setProperty('--sc', (1.28-0.28*ease).toFixed(4));
          s.setProperty('--op', clamp((p-0.62)/0.22).toFixed(3));
          break; }
        case 'hs': {
          if (!o.dist) break;
          const p = clamp(-r.top / (r.height - vh)); o.cur += (p-o.cur)*.14;
          o.track.style.transform=`translate3d(${(-o.cur*o.dist).toFixed(1)}px,0,0)`;
          o.bar.style.width=(o.cur*100).toFixed(2)+'%';
          const n=o.panels.length; o.cnt.textContent=String(Math.min(n, 1+Math.floor(o.cur*n*0.999))).padStart(2,'0');
          o.panels.forEach(img=>{ const b=img.parentElement.getBoundingClientRect(); const c=((b.left+b.width/2)/vw - .5); img.style.transform=`translate3d(${(-c*9).toFixed(2)}%,0,0)`; });
          break; }
        case 'np': {
          const p = clamp((vh - r.top)/vh); const e=RM?1:1-Math.pow(1-p,2);
          const s=o.el.style; s.setProperty('--ni',((1-e)*14).toFixed(2)+'%'); s.setProperty('--ns',((1-e)*22).toFixed(2)+'%'); s.setProperty('--nz',(1.22-0.22*e).toFixed(4)); s.setProperty('--no',(0.25+0.75*e).toFixed(3));
          break; }
      }
    }
    header();
    requestAnimationFrame(tick);
  };
  addEventListener('resize', size);
  requestAnimationFrame(tick);
  return { setup, refresh: size };
})();

addEventListener('keydown',e=>{ if(lb.hidden) return; if(e.key==='Escape')closeLB(); if(e.key==='ArrowLeft')showLB(lbI-1); if(e.key==='ArrowRight')showLB(lbI+1); });

/* ---------------- menu ---------------- */
const menu=document.getElementById('menu'), burger=document.getElementById('burger');
const openMenu=()=>{menu.hidden=false;burger.setAttribute('aria-expanded','true');requestAnimationFrame(()=>requestAnimationFrame(()=>menu.classList.add('open')));document.body.style.overflow='hidden';};
const closeMenu=()=>{menu.classList.remove('open');menu.hidden=true;burger.setAttribute('aria-expanded','false');document.body.style.overflow='';};
burger.onclick=openMenu; document.getElementById('menuX').onclick=closeMenu;

/* ---------------- router + transitions ---------------- */
const curtain=document.getElementById('curtain');
function render(){
  clearTimeout(slideTimer); if(!lb.hidden) closeLB(); if(!menu.hidden) closeMenu();
  const h=location.hash.slice(1)||'home';
  const views={home,about,awards,contact};
  let sec=h;
  if (views[h]) views[h]();
  else if (h==='work' || h.startsWith('work-')) { work(h.slice(5)); sec='work'; }
  else if (BY[h]) { project(h); sec='work'; }
  else { home(); sec='home'; }
  document.querySelectorAll('[data-r]').forEach(a=>{ if(a.dataset.r===sec) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.title = BY[h] ? `${BY[h].name} | Richter Architects` : 'Richter Architects';
  window.scrollTo({top:0,behavior:'instant'}); lastY=0; hd.classList.remove('hide');
  FX.setup();
}
let busy=false;
function route(){
  if (RM) { render(); return; }
  if (busy) { render(); return; }
  busy=true;
  curtain.className='curtain cover';
  setTimeout(()=>{ render(); curtain.className='curtain cover leave'; setTimeout(()=>{curtain.className='curtain';busy=false;},950); },560);
}
addEventListener('hashchange',route);
render();
// intro: logo on ink, then lift
setTimeout(()=>{ curtain.className='curtain intro leave'; setTimeout(()=>curtain.className='curtain',1000); }, RM?0:1500);
</script>

</body>
